name: release

# Tag vX.Y.Z to publish:
# - grill.mcpb: the Claude Desktop extension (double-click to install);
# - grill-skill.zip and weekly-review-skill.zip: for claude.ai, Customize → Skills → upload.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: node --test scripts/*.test.mjs
      - name: Build the Desktop extension
        run: |
          node scripts/build-extension.mjs
          npx -y @anthropic-ai/mcpb validate dist/extension/manifest.json
          npx -y @anthropic-ai/mcpb pack dist/extension dist/grill.mcpb
      - name: Zip the skills for claude.ai upload
        run: |
          cd skills
          zip -r ../dist/grill-skill.zip grill
          zip -r ../dist/weekly-review-skill.zip weekly-review
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/grill.mcpb dist/grill-skill.zip dist/weekly-review-skill.zip \
            --title "Grill $GITHUB_REF_NAME" --notes "Install steps: https://github.com/$GITHUB_REPOSITORY#set-up"
