name: release

# Releases the version in package.json. Run it by hand (nothing to type), or push the matching
# vX.Y.Z tag. It publishes:
# - grill.mcpb: the Claude Desktop extension (double-click to install);
# - grill-skill.zip and weekly-review-skill.zip: for claude.ai, Customize → Skills → upload.
on:
  push:
    tags: ["v*"]
  # By hand: no version to type, so a phone keyboard can't mistype one ("V0.1.0" failed here once).
  workflow_dispatch:

permissions:
  contents: write
  id-token: write      # signs the build-provenance attestation
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: node --test scripts/*.test.mjs
      - name: Build the Desktop extension
        run: |
          node scripts/build-extension.mjs
          npx -y @anthropic-ai/mcpb validate dist/extension/manifest.json
          npx -y @anthropic-ai/mcpb pack dist/extension dist/grill.mcpb
      - name: Zip the skills for claude.ai upload
        run: |
          cd skills
          # MIT asks for the notice in every copy, so each skill carries it.
          cp ../LICENSE grill/LICENSE && cp ../LICENSE weekly-review/LICENSE
          zip -r ../dist/grill-skill.zip grill
          zip -r ../dist/weekly-review-skill.zip weekly-review
      - name: Checksums
        run: cd dist && sha256sum grill.mcpb grill-skill.zip weekly-review-skill.zip > SHA256SUMS && cat SHA256SUMS
      - name: Attest build provenance
        # Attestations need a public repo (or GitHub Enterprise Cloud); a private pre-launch release skips them.
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/grill.mcpb
            dist/grill-skill.zip
            dist/weekly-review-skill.zip
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The tag is always the version the manifests carry; a pushed tag must name that same one.
          TAG="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "::error::pushed tag $GITHUB_REF_NAME, but package.json says $TAG. Bump the version files first."
            exit 1
          fi
          # Draft first, then publish: with release immutability on, a published release takes no
          # more assets, so they must all be attached before it goes public.
          gh release create "$TAG" --draft --target "$GITHUB_SHA" dist/grill.mcpb dist/grill-skill.zip dist/weekly-review-skill.zip dist/SHA256SUMS \
            --title "Grill $TAG" --notes "Install steps: https://github.com/$GITHUB_REPOSITORY#set-up. Verify a download: gh attestation verify <file> --repo $GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false
