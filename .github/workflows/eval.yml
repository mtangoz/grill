name: eval

# The judge's self-improvement measurement loop: run the synthetic cases under evals/cases/
# through the real judge CLI and score the result against evals/thresholds.json. Never touches
# a real user's decision — see evals/README.md.
on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:
  # With the secret set, every run here is a paid run. A pull request starts one only when it
  # changes the judge, a case or a threshold. A change to a doc or to another eval folder does not.
  pull_request:
    paths:
      - scripts/judge.mjs
      - scripts/judgeCore.mjs
      - scripts/checkCore.mjs
      - evals/cases/**
      - evals/thresholds.json

permissions:
  contents: read
  issues: write

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Pull requests may skip when there is no key (a fork gets no secrets). The weekly and
      # manual runs must measure: with no key they fail with exit 2, "not measured".
      # Any run where no case gets a verdict back also exits 2. A dead key is not a quality result.
      # The script writes reached_judge to the step outputs: how many cases got a verdict.
      - name: Run the judge self-eval
        id: eval
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          EVENT: ${{ github.event_name }}
        run: |
          set +e
          if [ "$EVENT" = "pull_request" ]; then node scripts/eval.mjs; else node scripts/eval.mjs --require-key; fi
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results
          if-no-files-found: ignore
      - name: On a scheduled failure, open or update ONE issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.eval.outputs.code }}
        run: |
          set -e
          if [ "$CODE" = "2" ]; then
            TITLE="Judge self-eval is not measuring"
            BODY="The weekly judge self-eval ran on $(date -u +%F) and no case reached a judge. Nothing was measured. Either there is no OPENROUTER_API_KEY secret, or the key is dead or out of credit. The run log says which. Fix the secret (a capped key), then run the eval workflow by hand. A run that measures closes this issue.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
          TITLE="Judge quality below threshold"
          BODY="The weekly judge self-eval (evals/) failed its quality thresholds on $(date -u +%F).

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          See the run's job summary or the uploaded eval-results artifact for the metrics table and which cases failed."
          fi
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --search "$TITLE in:title" --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi
      # The other half of that alarm. Once a weekly or manual run measures again, the open
      # "not measuring" issue is closed, so it does not sit there as a stale alarm. A pull
      # request run never closes it, and only an issue with exactly this title is touched.
      - name: On a weekly or manual run that measured, close the open not-measuring issue
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.eval.outputs.reached_judge != '' && steps.eval.outputs.reached_judge != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REACHED: ${{ steps.eval.outputs.reached_judge }}
        run: |
          set -e
          TITLE="Judge self-eval is not measuring"
          NUMBER=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number,title --jq '[.[] | select(.title == "Judge self-eval is not measuring")][0].number // empty')
          if [ -n "$NUMBER" ]; then
            gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Measuring again on $(date -u +%F). Cases that reached a judge: $REACHED.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
