name: publish-mcp

# Publishes server.json to the official MCP Registry
# (https://registry.modelcontextprotocol.io) as io.github.mtangoz/grill.
# `mcp-publisher login github-oidc` uses this run's OIDC token, so the workflow
# needs `id-token: write` and stores no registry secret.
# A published GitHub release runs this on that release's tag, after the .mcpb
# asset exists. The listing already in this repo is not on the registry yet:
# Actions → publish-mcp → Run workflow, on main.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Log in to the MCP Registry
        run: ./mcp-publisher login github-oidc --registry=https://registry.modelcontextprotocol.io
      - name: Publish server.json
        run: ./mcp-publisher publish
